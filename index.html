<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Delta Direct Install</title>
<style>
*{box-sizing:border-box} body{margin:0;min-height:100vh;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f2f2f7;display:flex;align-items:center;justify-content:center;color:#111} .card{text-align:center;padding:40px 24px} h1{font-size:32px;margin:0 0 12px} p{color:#666;margin:0 0 28px} .install-main{border:0;border-radius:18px;padding:18px 54px;font-size:22px;font-weight:700;background:#007aff;color:white} .overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.52);align-items:center;justify-content:center;padding:18px} .dialog{width:min(100%,900px);background:rgba(45,45,48,.96);border-radius:32px;color:#f5f5f7;text-align:center;padding:34px 34px 18px;box-shadow:0 20px 70px rgba(0,0,0,.45)} .message{font-size:29px;line-height:1.35;margin:0 10px 42px} .actions{display:flex;gap:24px} .actions button{flex:1;border:0;border-radius:72px;padding:26px 10px;font-size:28px;font-weight:600;color:#f5f5f7;background:#747474} .actions .cancel{background:linear-gradient(#62c7e7,#2ca7d4)} @media(max-width:600px){.dialog{border-radius:26px;padding:28px 18px 14px}.message{font-size:24px;margin-bottom:30px}.actions{gap:16px}.actions button{font-size:24px;padding:22px 8px}}
</style>
</head>
<body>
<main class="card"><h1>Delta</h1><p>Tap below to install.</p><button class="install-main" onclick="showDialog()">Install</button></main>
<div class="overlay" id="overlay" role="dialog" aria-modal="true">
  <div class="dialog">
    <p class="message">“raw.githubusercontent.com” would like to install “Delta”</p>
    <div class="actions">
      <button class="cancel" onclick="hideDialog()">Cancel</button>
      <button onclick="installApp()">Install</button>
    </div>
  </div>
</div>
<script>
const installUrl='itms-services://?action=download-manifest&url=https://delta.bz/manifest.plist';
function showDialog(){document.getElementById('overlay').style.display='flex'}
function hideDialog(){document.getElementById('overlay').style.display='none'}
function installApp(){window.location.href=installUrl}
</script>
</body>
</html>
